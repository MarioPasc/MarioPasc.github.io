###############################################################################
# Site metadata
###############################################################################
title: "Mario Pascual González"
description: >-
  Mario Pascual González: MSc student in Artificial Intelligence (Universidad
  Autónoma de Madrid). Bayesian deep learning, deep generative models and
  medical imaging.
url: "https://mariopasc.github.io"
baseurl: ""
lang: en
date_format: "%-d %b %Y"

###############################################################################
# Content
###############################################################################
# Page content lives in _data/ (profile, news, publications, cv, metrics);
# the top-level pages only arrange it. Blog posts live in content/_blog/.
collections_dir: content
collections:
  blog:
    output: true
    permalink: /blog/:title/

defaults:
  - scope:
      path: ""
    values:
      layout: page
  - scope:
      path: ""
      type: blog
    values:
      layout: post

###############################################################################
# Build
###############################################################################
# Must build with both Jekyll 4 (local Gemfile) and the GitHub Pages builder
# (Jekyll 3.10), so no Sass and only Pages-whitelisted plugins.
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
permalink: pretty
# The Pages builder applies jekyll-theme-primer unless told otherwise.
theme: null
plugins:
  - jekyll-sitemap
exclude:
  - vendor
  - node_modules
  - scripts
  - Gemfile
  - Gemfile.lock
  - README.md
  - CLAUDE.md
  - package.json
  - package-lock.json
  - .vscode
  - .claude
