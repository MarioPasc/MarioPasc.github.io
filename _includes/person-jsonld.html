{%- assign p = site.data.profile -%}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "name": {{ p.name | jsonify }},
  "url": {{ site.url | jsonify }},
  "image": {{ '/assets/images/portrait.jpg' | absolute_url | jsonify }},
  "jobTitle": {{ p.positions[0].role | jsonify }},
  "affiliation": [{% for pos in p.positions %}{"@type": "Organization", "name": {{ pos.org | jsonify }}}{% unless forloop.last %}, {% endunless %}{% endfor %}],
  "sameAs": [{% for l in p.links %}{{ l.url | jsonify }}{% unless forloop.last %}, {% endunless %}{% endfor %}]
}
</script>
