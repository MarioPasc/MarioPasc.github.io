---
layout: default
---
<article class="post">
  <header class="post-header">
    <h1>{{ page.title }}</h1>
    <p class="meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%-d %B %Y" }}</time>
      {%- if page.tag %} · {{ page.tag }}{% endif %}
    </p>
  </header>
  {{ content }}
  <footer class="post-footer">
    <a href="{{ '/blog/' | relative_url }}">All posts</a>
  </footer>
</article>
